# Kong Gateway for Watchdog's model calls. Render the config first: python infra/kong/render.py
#   docker compose -f infra/kong/compose.yaml up -d                      # real Anthropic (needs ANTHROPIC_API_KEY)
#   KONG_UPSTREAM_URL=http://mock-anthropic:9999 python infra/kong/render.py && \
#     docker compose -f infra/kong/compose.yaml --profile mock up -d    # offline stand-in, no key, no spend
# The kong image is built from ./Dockerfile (adds the Go plugin): docker compose ... up -d --build
# Proxy: http://localhost:8010 (point DL_GATEWAY_URL here). Admin and /metrics: http://127.0.0.1:8011 (local only).
services:
  kong:
    build: .                                         # kong/kong-gateway:3.12 + the watchdog-audit Go plugin
    image: watchdog-kong:local
    container_name: watchdog-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      # Keep request bodies (photos included) in memory, where ai-proxy and watchdog-audit can read them.
      KONG_NGINX_HTTP_CLIENT_BODY_BUFFER_SIZE: 16m
      KONG_NGINX_HTTP_CLIENT_MAX_BODY_SIZE: 16m
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}      # read by the {vault://env/anthropic-api-key} reference
    ports:
      - "8010:8000"
      - "127.0.0.1:8011:8001"
    volumes:
      - ./kong.yml:/kong/kong.yml:ro
      - ./audit:/kong/audit                          # watchdog-audit's chain; check it with scripts/verify_audit_chain.py
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      retries: 20

  mock-anthropic:
    profiles: ["mock"]
    image: python:3.12-slim
    container_name: watchdog-mock-anthropic
    command: ["python", "/app/mock_anthropic.py", "9999"]
    volumes:
      - ./mock_anthropic.py:/app/mock_anthropic.py:ro
