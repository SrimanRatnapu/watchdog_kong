# Kong Gateway for Watchdog's model calls. Render the config first: python infra/kong/render.py
#   docker compose -f infra/kong/compose.yaml up -d                      # real Anthropic (needs ANTHROPIC_API_KEY)
#   KONG_UPSTREAM_URL=http://mock-anthropic:9999 python infra/kong/render.py && \
#     docker compose -f infra/kong/compose.yaml --profile mock up -d    # offline stand-in, no key, no spend
# Proxy: http://localhost:8010 (point DL_GATEWAY_URL here). Admin and /metrics: http://127.0.0.1:8011 (local only).
services:
  kong:
    image: kong/kong-gateway:3.12
    container_name: watchdog-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}      # read by the {vault://env/anthropic-api-key} reference
    ports:
      - "8010:8000"
      - "127.0.0.1:8011:8001"
    volumes:
      - ./kong.yml:/kong/kong.yml:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      retries: 20

  mock-anthropic:
    profiles: ["mock"]
    image: python:3.12-slim
    container_name: watchdog-mock-anthropic
    command: ["python", "/app/mock_anthropic.py", "9999"]
    volumes:
      - ./mock_anthropic.py:/app/mock_anthropic.py:ro
