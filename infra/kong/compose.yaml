# Kong Gateway for Watchdog's model calls. Render the config first: python infra/kong/render.py
#   docker compose -f infra/kong/compose.yaml up -d                      # real Anthropic (needs ANTHROPIC_API_KEY)
#   KONG_UPSTREAM_URL=http://mock-anthropic:9999 python infra/kong/render.py && \
#     docker compose -f infra/kong/compose.yaml --profile mock up -d    # offline stand-in, no key, no spend
# The kong image is built from ./Dockerfile (adds the Go plugin): docker compose ... up -d --build
# Proxy: http://localhost:8010 (point DL_GATEWAY_URL here). Admin and /metrics: http://127.0.0.1:8011 (local only).
services:
  kong:
    build: .                                         # kong/kong-gateway:3.12 + the watchdog-audit Go plugin
    image: watchdog-kong:local
    container_name: watchdog-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      # Keep request bodies (photos included) in memory, where ai-proxy and watchdog-audit can read them.
      KONG_NGINX_HTTP_CLIENT_BODY_BUFFER_SIZE: 16m
      KONG_NGINX_HTTP_CLIENT_MAX_BODY_SIZE: 16m
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}      # read by the {vault://env/anthropic-api-key} reference
    ports:
      - "8010:8000"
      - "127.0.0.1:8011:8001"
    volumes:
      - ./kong.yml:/kong/kong.yml:ro
      - ./audit:/kong/audit                          # watchdog-audit's chain; check it with scripts/verify_audit_chain.py
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      retries: 20

  mock-anthropic:
    profiles: ["mock"]
    image: python:3.12-slim
    container_name: watchdog-mock-anthropic
    command: ["python", "/app/mock_anthropic.py", "9999"]
    volumes:
      - ./mock_anthropic.py:/app/mock_anthropic.py:ro

  # Dashboards: docker compose -f infra/kong/compose.yaml --profile observability up -d
  # Grafana http://localhost:3001 (opens on the Watchdog dashboard, no login to view). Prometheus on 127.0.0.1:9090.
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.5.0
    container_name: watchdog-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prices.rules.yml:/etc/prometheus/prices.rules.yml:ro

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.1.1
    container_name: watchdog-grafana
    depends_on: [prometheus]
    ports:
      - "3001:3000"                                  # 3000 is the Watchdog frontend
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/watchdog-kong.json
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"         # no downloads or update checks: the stack works offline
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards/provider.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
