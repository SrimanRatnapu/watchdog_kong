name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Tests (no API keys, no live services)
        working-directory: backend
        run: |
          uv sync
          uv run pytest -q -m "not integration"

  kong-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: infra/kong/plugins/watchdog-audit/go.mod
      - name: Vet and test the watchdog-audit plugin
        working-directory: infra/kong/plugins/watchdog-audit
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
      - name: Kong config renders
        run: python3 infra/kong/render.py --check
        env:
          DL_GATEWAY_KEY_TRIAGE: ci
          DL_GATEWAY_KEY_AGENTS: ci
          DL_GATEWAY_KEY_EXAMINER: ci
          DL_GATEWAY_KEY_TRANSLATION: ci
          DL_GATEWAY_KEY_EVAL: ci

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Type check
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
